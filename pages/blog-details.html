<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Full Stride article — guides, care routines, trends and store news."
    />
    <title>Article — Stride</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ef4444'/%3E%3Cpath d='M5 22h22l-2-6-7-2-5 4-4-2-4 2z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var t = localStorage.getItem('stride-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        var d = localStorage.getItem('stride-dir');
        if (d) document.documentElement.setAttribute('dir', d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- navbar.js injects the shared utility bar, header and footer here -->

    <main id="top">
      <!-- ===========================================================
           ARTICLE — content rendered by js/blog.js?id=...
           =========================================================== -->
      <section class="section" aria-label="Article">
        <div class="wrap">
          <article class="detail-layout">
            <div class="article" data-article>
              <!-- Rendered from STRIDE_DATA by js/blog.js -->
            </div>

            <!-- ========================================================
                 SIDEBAR
                 ======================================================== -->
            <aside class="sidebar" aria-label="Sidebar">
              <div class="widget">
                <h2 class="widget__title">Recent articles</h2>
                <ul class="widget__recent" data-widget-recent>
                  <!-- Rendered by js/blog.js -->
                </ul>
              </div>

              <div class="widget">
                <h2 class="widget__title">Categories</h2>
                <ul class="widget__list" data-widget-categories>
                  <!-- Rendered by js/blog.js -->
                </ul>
              </div>

              <div class="widget">
                <h2 class="widget__title">Popular tags</h2>
                <div class="widget__tags" data-widget-tags>
                  <!-- Rendered by js/blog.js -->
                </div>
              </div>

              <div class="widget">
                <h2 class="widget__title">Get the guide</h2>
                <p class="widget__recent-date" style="margin-bottom:var(--space-3);line-height:1.55;">
                  One practical article every two weeks, straight to your inbox.
                </p>
                <form data-form novalidate>
                  <label class="visually-hidden" for="side-newsletter">Email address</label>
                  <div class="field">
                    <input id="side-newsletter" type="email" name="email" placeholder="you@example.com" required />
                    <span class="field-error" hidden></span>
                  </div>
                  <button type="submit" class="btn btn--primary btn--block" style="margin-top:var(--space-2);">Subscribe</button>
                  <p class="promo-strip__done" data-form-success hidden style="color:var(--success);font-size:var(--text-sm);">
                    You are in. Welcome aboard.
                  </p>
                </form>
              </div>
            </aside>
          </article>

          <!-- Missing-post fallback (hidden until blog.js renders) -->
          <p data-article-missing hidden></p>
        </div>
      </section>

      <!-- ===========================================================
           MORE CTA
           =========================================================== -->
      <section class="section section--soft" aria-label="More articles">
        <div class="wrap wrap--narrow" style="text-align:center;">
          <h2 class="sec-title">Keep reading.</h2>
          <div class="err-ctas" style="margin-top:var(--space-6);">
            <a href="blog.html" class="btn btn--primary">All articles <span aria-hidden="true">→</span></a>
            <a href="products.html" class="btn btn--ghost">Shop products</a>
          </div>
        </div>
      </section>
    </main>

    <script src="../js/data.js" defer></script>
    <script src="../js/navbar.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/form-validation.js" defer></script>
    <script src="../js/blog.js" defer></script>
  </body>
</html>
